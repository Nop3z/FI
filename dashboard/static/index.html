<!DOCTYPE html>
<!--
  FI · RISC-V 观测 — 只读故障观测/分析/仿真看板（深色面板 · 参考截图 1:1 复刻）

  基于 ViewViewView (https://github.com/Nop3z/ViewViewView) 的代码修改/复制而来。
  原项目以 MulanPSL-2.0 (http://license.coscl.org.cn/MulanPSL2) 许可。
  本文件按 MulanPSL-2.0 第 4 条保留原版权与许可声明。
  许可证全文副本：dashboard/vendor/viewviewview/LICENSE（分发时随附）。

  复用片段清单（来源路径 + 函数/选择器）：
    - dashboard/vendor/viewviewview/src/viewviewview/static/index.mjs
        #updatestatchart        柱高按图内最高桶归一化、data-tip 记录真实占比
        #buildstatchart         柱池 + 基线的常量节点构建（象限布局见 .vvv-stats-layout）
        #attachstatshovertag    图窗级共享悬停提示标签
        #buildcountstable       汇总两列表（state | count，count 绿色右对齐）结构
        #buildfooter            底部状态行「已记录 n 行 / 当前窗口 m 行 · live」结构
      （函数名保持原样；适配为 FI 的 /api/histogram 契约，桶为 {delay_raw, count}。
       buildStatChart 增加 plotPx 参数以支持通高第三图。
       未复用 render() 的 model 绑定段 index.mjs:42-101，改为 fetch 轮询直调。）
    - dashboard/vendor/viewviewview/src/viewviewview/static/styles.css
        .vvv-root/.vvv-pane/.vvv-band/.vvv-stats-layout  布局骨架 → .panel/.block/.panel-body/.col-*
        .vvv-stat-chart/.vvv-stat-col/.vvv-stat-fill/.vvv-stat-lab/.vvv-stat-baseline/.vvv-stats-tip
        .vvv-table 表头下划线 + 数值右对齐约定；.vvv-footer/.vvv-live 底部状态行
      （配色按用户参考截图逐像素实测值替换：
        页面白底 #ffffff / 面板 #23282e / 内区 #1d2226 / 细缝 #2c3137 /
        表格数字绿 VVV #19ff25（--num-strong，仅表格数字）/ AI 卡片等沿用 #55a64d（--num） / 柱色 SUCCESS #19ff25 · HANG #e05252（VVV .vvv-stat-fill--hang 原值） · UNEXPECTED #4d33ff /
        state 近白 #e9edf0 · response 淡蓝白 #e2f0fd · 刻度灰 #727a85 ·
        图例灰 #888c95 · 表头线 #878791 · 底部 live 绿 #4a8c4f + 灰 #898d96）

  展示纪律：本页 DOM 构造遵守上游 createElement/textContent 禁 innerHTML 约定
  （REUSE.md §2.6）；状态标签按原始字面量；语义未确认；ns = raw × 10 为假设；
  只读——不含任何注入/执行/控制类按钮，仅刷新与筛选。
  数据接口均为 GET JSON（契约见 /api/contracts）；此文件不覆盖旧 index.html。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FI · RISC-V 观测</title>
<style>
/* ============ tokens（参考截图实测色板） ============ */
:root{
  --page:#ffffff;         /* 页面白底（参考图 Notebook 页面） */
  --panel:#23282e;        /* 面板深蓝灰底 */
  --inset:#1d2226;        /* 面板内区底色 */
  --seam:#2c3137;         /* 区块间细缝 / 基线 */
  --fg:#ffffff;           /* 标题/表头白 */
  --fg-state:#e9edf0;     /* state 标签近白 */
  --fg-blue:#e2f0fd;      /* errcode/response 淡蓝白 */
  --num:#55a64d;          /* 数字绿：AI 卡片等沿用 */
  --num-strong:#19ff25;   /* 表格数字绿（VVV --vvv-number 原值）：汇总 count、明细 delay/pulse */
  --tick:#727a85;         /* 刻度/次级灰 */
  --legend:#888c95;       /* 图例灰 */
  --rule:#878791;         /* 表头下 1px 分隔线 */
  --live:#4a8c4f;         /* 底部 live 绿 */
  --foot:#898d96;         /* 底部状态灰 */
  --c-success:#19ff25;    /* 柱色：SUCCESS（VVV styles.css:29 --vvv-count 默认柱色） */
  --c-hang:#e05252;       /* 柱色：HANG 红（对齐 VVV .vvv-stat-fill--hang） */
  --c-unexpected:#4d33ff; /* 柱色：UNEXPECTED（VVV styles.css:221-225） */
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--page);
  color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  line-height:1.45;
}

/* ============ 深色面板（白底页面居中一块） ============ */
.panel{width:93%;margin:18px auto 0;background:var(--panel);border-radius:6px;padding:8px 10px}
.panel-body{display:flex;gap:3px;background:var(--seam)}
.block{background:var(--inset);border-radius:3px;min-width:0}

/* -- 顶栏（极简一行，融入面板顶部，不抢主体） -- */
.strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 8px 12px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:4px}
.brand h1{font-size:14px;font-weight:600;color:var(--fg)}
.brand .sub{font-size:11px;color:var(--tick)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:3px;background:var(--inset);font-size:11px;color:var(--foot);white-space:nowrap}
.pill b{color:var(--fg-state);font-weight:600}
.spacer{flex:1 1 auto;min-width:8px}
.clock{font-size:11px;color:var(--tick);white-space:nowrap}
button.refresh{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 14px;border:none;border-radius:3px;
  background:var(--seam);color:var(--fg-state);
  font-size:12px;font-family:inherit;cursor:pointer;
}
button.refresh:hover{background:#3a4149;color:var(--fg)}
button.refresh:active{transform:scale(.97)}
button.refresh.spin svg{animation:spin 1s linear infinite}
button.refresh svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ 面板主体：左栏 45%（汇总表+明细） · 右栏 55%（三图） ============ */
.col-left{flex:0 0 45%;display:flex;flex-direction:column;gap:3px;min-width:0;min-height:0}
.col-right{flex:1 1 auto;display:flex;gap:3px;min-width:0}
.detail-block{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}

/* -- 状态汇总表（state | count，紧凑两列表） -- */
.counts-block{flex:0 0 auto}
.counts-table{width:max-content;border-collapse:collapse;font-variant-numeric:tabular-nums}
.counts-table thead th{text-align:left;padding:6px 10px;color:var(--fg);font-size:11.5px;font-weight:600;border-bottom:1px solid var(--rule);white-space:nowrap}
.counts-table thead th.num{text-align:right}
.counts-table tbody td{padding:4px 10px;font-size:12.5px;color:var(--fg-state);white-space:nowrap}
.counts-table tbody td.num{color:var(--num-strong);text-align:right;font-variant-numeric:tabular-nums}

/* -- 实时明细表 -- */
.tblwrap{flex:1 1 auto;min-height:120px;overflow:auto;border-radius:3px}
.tblwrap::-webkit-scrollbar{width:6px}
.tblwrap::-webkit-scrollbar-track{background:transparent}
.tblwrap::-webkit-scrollbar-thumb{background:var(--seam);border-radius:3px}
.tblwrap::-webkit-scrollbar-thumb:hover{background:#3a4149}
table.grid{width:max-content;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:12.5px}
/* 表头：白字，表头下唯一一条 1px #878791 线；无斑马纹、无行分隔线 */
table.grid thead th{
  position:sticky;top:0;z-index:2;
  text-align:left;padding:6px 10px;
  background:var(--inset);
  color:var(--fg);font-size:11.5px;font-weight:600;white-space:nowrap;
  border-bottom:1px solid var(--rule);
}
table.grid thead th.num,table.grid td.num{text-align:right}
/* 参考图配色：state 近白、delay/pulse 绿数字、response 淡蓝白、布尔列弱灰 */
table.grid tbody td.num{color:var(--num-strong);font-variant-numeric:tabular-nums}
table.grid tbody td:first-child{color:var(--fg-state)}
table.grid tbody td{
  padding:4px 10px;color:var(--fg-blue);
  white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis;
}
table.grid tbody td.dim{color:var(--foot)}
/* 最新行仅极轻微加深（参考图做法），不醒目高亮 */
table.grid tbody tr:first-child{background:#202529}
table.grid tbody tr:hover td{background:rgba(255,255,255,.02)}
/* 新行推入动画：从 0 高/透明展开 0.35s（不做彩色闪光） */
table.grid tbody tr.fresh td{animation:pushin .35s ease-out}
@keyframes pushin{
  from{max-height:0;opacity:0;padding-top:0;padding-bottom:0}
  to{max-height:30px;opacity:1;padding-top:4px;padding-bottom:4px}
}

/* -- 右栏：三张分布图（左子列 SUCCESS/HANG 上下叠放 · 右子列 UNEXPECTED 通高） -- */
.charts-col{flex:1 1 0;min-width:0;min-height:0;display:flex;flex-direction:column;gap:3px}
/* 弹性高度：SUCCESS/HANG 两块平分 charts-col（各占一半）；tall 贴底、内容沉底 */
.chart-block{flex:1 1 0;min-height:0;background:var(--inset);border-radius:3px;padding:10px;min-width:0;display:flex;flex-direction:column}
.chart-block.tall{flex:1 1 0;justify-content:flex-end}
.hist-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.hist-head b{font-size:12px;font-weight:600;color:var(--fg)}
.legend{display:inline-flex;align-items:center;gap:5px}
.legend .sw{width:8px;height:8px;display:inline-block;border-radius:1px}
.legend .val{font-size:10px;color:var(--legend)}
.fill-SUCCESS{background:var(--c-success)}
.fill-HANG{background:var(--c-hang)}
.fill-UNEXPECTED{background:var(--c-unexpected)}
/* 图表骨架复用 ViewViewView styles.css（.vvv-stat-chart 等）：无网格线，仅底部基线；
   弹性高度：flex 填满所在 .chart-block（SUCCESS/HANG 随块各半 · UNEXPECTED 通高），
   min-height 200px = 116px 最小绘图形 + 84px 标签区（窄模式防塌缩） */
.stat-chart{align-items:flex-end;display:flex;gap:1px;min-width:0;position:relative;flex:1 1 auto;min-height:200px}
.stat-baseline{border-top:1px solid var(--seam);left:0;right:0;pointer-events:none;position:absolute}
.stat-col{display:flex;flex:1 1 0;flex-direction:column;justify-content:flex-end;min-width:0}
.stat-fill{flex:0 0 auto;height:0;width:100%;border-radius:1px 1px 0 0;min-height:1px;transition:height .45s ease-out}
.stat-col:hover .stat-fill{filter:brightness(1.15)}
/* X 轴刻度标签：delay 区间（如 3135-3140，9 字符）垂直排（对齐 VVV .vvv-stat-lab
   84px 原值，自下而上阅读），灰 #727a85；overflow:hidden 防溢出遮挡 */
.stat-lab{display:flex;align-items:center;justify-content:center;flex:0 0 84px;color:var(--tick);font-size:10px;overflow:hidden;white-space:nowrap;font-variant-numeric:tabular-nums;writing-mode:vertical-rl;transform:rotate(180deg)}
.axis-note{margin-top:6px;font-size:10px;color:var(--tick);min-height:14px}
.hist-tip{
  position:absolute;display:none;pointer-events:none;z-index:5;
  transform:translate(-50%,-100%);
  background:var(--seam);border:1px solid #3a4149;border-radius:3px;
  padding:3px 7px;font-size:10px;color:var(--fg-state);white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

/* -- 面板底部状态行（右下：灰字 + 绿 live） -- */
.panel-foot{display:flex;justify-content:flex-end;align-items:center;gap:12px;padding:10px 8px 4px;font-size:11px;color:var(--foot);font-variant-numeric:tabular-nums}
.panel-foot .live{display:inline-flex;align-items:center;gap:4px;color:var(--live)}
.panel-foot .live::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block}

/* ============ 面板下方可折叠区（AI 活动 / 契约，同一深蓝灰底） ============ */
.fold{width:93%;margin:14px auto 0;background:var(--panel);border-radius:6px}
details.fold>summary{cursor:pointer;list-style:none;padding:12px 16px;font-size:12px;color:var(--foot);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary:hover{color:var(--fg-state)}
.fold summary .hint{font-size:10.5px;color:var(--tick);font-weight:400}
.fold summary .chev{font-size:10px;color:var(--tick);transition:transform .2s ease}
details.fold[open]>summary .chev{transform:rotate(90deg)}
.fold-body{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}

/* -- AI 活动 -- */
.activity .mini{display:flex;gap:10px;flex-wrap:wrap}
.mini-card{flex:1 1 130px;background:var(--inset);border-radius:3px;padding:12px 14px;min-width:0}
.mini-card .k{font-size:11px;color:var(--tick)}
.mini-card .v{font-size:22px;font-weight:600;color:var(--num);font-variant-numeric:tabular-nums}
.mini-card .v.fail{color:var(--c-hang)}
.mini-card .v.run{color:var(--c-unexpected)}
.toolbars{display:flex;flex-direction:column;gap:6px}
.trow{display:flex;align-items:center;gap:10px;font-size:11px}
.trow .tn{flex:0 0 168px;color:var(--foot);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tb{flex:1;height:4px;border-radius:2px;background:var(--inset);overflow:hidden}
.trow .tb i{display:block;height:100%;background:var(--num);transition:width .5s ease}
.trow .tc{flex:0 0 44px;text-align:right;color:var(--tick);font-variant-numeric:tabular-nums}
.recent{display:flex;flex-direction:column;gap:5px;max-height:264px;overflow:auto}
.rc{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:3px;background:var(--inset)}
.rc .dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:var(--tick)}
.rc.running .dot{background:var(--c-unexpected);animation:breath 1.6s ease-in-out infinite}
.rc.ok .dot{background:var(--num)}
.rc.fail .dot{background:var(--c-hang)}
.rc .tool{font-size:11px;color:var(--fg-state);flex:0 0 auto}
.rc .args{flex:1;min-width:0;font-size:11px;color:var(--tick);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc .dur{font-size:11px;color:var(--tick);flex:0 0 auto;font-variant-numeric:tabular-nums}
.rc.running .dot{animation:breath 1.6s ease-in-out infinite}
@keyframes breath{0%,100%{opacity:1}50%{opacity:.45}}

/* -- 契约区 -- */
.crow{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--foot)}
.crow b{color:var(--fg-state);font-weight:600}
.schema-list{display:flex;gap:8px;flex-wrap:wrap}
.schema-list code{font-size:11px;padding:3px 9px;border-radius:3px;background:var(--inset);color:var(--foot)}
.warnbox{display:flex;flex-direction:column;gap:6px}
.warnbox .w{font-size:11.5px;color:var(--c-hang);background:rgba(224,82,82,.08);border:1px solid rgba(224,82,82,.25);border-radius:3px;padding:8px 12px}
.warnbox .none{color:var(--tick);font-size:12px}
.ver-list{display:flex;flex-direction:column;gap:4px}
.ver-list .vr{font-size:11px;color:var(--tick)}
.footer-note{font-size:11px;color:var(--tick)}

/* ============ 响应式 ============ */
@media (max-width:1100px){
  .panel-body{flex-direction:column}
  .col-left{flex:1 1 auto}
  .col-right{flex-direction:column}
  /* 窄模式无整屏定高：图表块改按内容自然高（.stat-chart min-height 200 兜底），
     flex 平分/贴底仅在桌面（≥1101px 定高 panel-body）下生效 */
  .charts-col{flex:0 0 auto}
  .chart-block,.chart-block.tall{flex:0 0 auto}
  .trow .tn{flex-basis:120px}
}
/* 桌面优先（≥1101px）：主面板一屏收纳，明细表内部滚动 */
@media (min-width:1101px){
  .panel-body{height:calc(100vh - 110px);min-height:560px}
}
@media (max-width:640px){
  .panel{width:97%;margin-top:16px}
  .fold{width:97%}
}
</style>
</head>
<body>

<div class="panel">
  <header class="strip">
    <div class="brand">
      <h1>FI · RISC-V 观测</h1>
      <span class="sub">只读看板</span>
    </div>
    <span class="pill" id="pill-contract">契约 <b>—</b></span>
    <span class="pill">语义 unconfirmed-v0.1</span>
    <span class="pill">ns = raw × 10（假设）</span>
    <span class="spacer"></span>
    <span class="clock" id="clock">—</span>
    <button class="refresh" id="btn-refresh" title="立即刷新全部数据">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
      刷新
    </button>
  </header>

  <div class="panel-body">
    <!-- 左栏 45%：状态汇总表 + 实时明细 -->
    <div class="col-left">
      <section class="block counts-block" aria-label="状态汇总">
        <div id="states"><!-- JS 生成 state | count 汇总表 --></div>
      </section>
      <section class="block detail-block" aria-label="实时明细">
        <div class="tblwrap">
          <table class="grid" id="rec-table">
            <thead><tr>
              <th>state</th>
              <th class="num">delay·raw</th>
              <th class="num">pulse·raw</th>
              <th>response</th><th>glitched</th><th>unexpected</th>
            </tr></thead>
            <tbody id="rec-body"></tbody>
          </table>
        </div>
      </section>
    </div>

    <!-- 右栏 55%：左子列 SUCCESS/HANG 上下叠放 · 右子列 UNEXPECTED 通高 -->
    <div class="col-right" id="hist-grid"><!-- JS 生成三张分布图 --></div>
  </div>

  <div class="panel-foot">
    <span id="rec-total">—</span>
    <span id="rec-updated">尚未加载 · 2s 自动刷新</span>
    <span class="live">live</span>
  </div>
</div>

<!-- AI 活动（可折叠，同一深蓝灰底） -->
<details class="fold activity">
  <summary><span class="chev">▶</span>AI 活动 <span class="hint">3s 轮询 · 只读展示</span></summary>
  <div class="fold-body">
    <div class="mini" id="ai-mini"></div>
    <div class="toolbars" id="ai-tools"></div>
    <div class="recent" id="ai-recent"></div>
  </div>
</details>

<!-- 契约区（可折叠，同一深蓝灰底） -->
<details class="fold">
  <summary><span class="chev">▶</span>契约与单位假设 <span class="hint">语义未确认 · 展开查看</span></summary>
  <div class="fold-body">
    <div class="crow">契约版本 <b id="ct-version">未知</b> · schema 常量 <b id="ct-schema">未知</b> · 状态语义 <b id="ct-semantics">未知</b></div>
    <div>
      <div class="footer-note" style="margin-bottom:6px">schema 清单</div>
      <div class="schema-list" id="ct-schemas"><span class="footer-note">未知</span></div>
    </div>
    <div>
      <div class="footer-note" style="margin-bottom:6px">告警（后端 warnings 原样列出）</div>
      <div class="warnbox" id="ct-warnings"><span class="none">未知</span></div>
    </div>
    <div>
      <div class="footer-note" style="margin-bottom:6px">近期版本</div>
      <div class="ver-list" id="ct-versions"><span class="footer-note">未知</span></div>
    </div>
  </div>
</details>

<script>
"use strict";
/* =====================================================================
 * AI 配置指南（只读看板：无任何配置控件；配置入口仅此对象 + URL 白名单覆盖）
 *
 * 用法 A · 改文件：直接编辑下方 window.FI_CONFIG 的字段值（长期默认）。
 * 用法 B · 改 URL ：页面查询参数按次覆盖（AI/脚本注入），仅收以下白名单并
 *                   严格校验；非法值静默忽略并保持默认（不抛错、不空白页）。
 *                   URL 优先于文件值，两类配置可叠加。
 *
 *   参数              类型   合法范围 / 校验规则                     覆盖目标
 *   ──────────────────────────────────────────────────────────────────────────
 *   limit             整数   1–500（纯数字）                         records.defaultLimit；
 *                                                                不在下拉候选内时自动
 *                                                                追加为「条数」选项
 *   poll_records      整数   ≥500（毫秒，纯数字）                    poll.records
 *   poll_activity     整数   ≥500                                    poll.activity
 *   poll_histogram    整数   ≥500                                    poll.histogram

/* ---------- ?demo=1 预览模式：每 ~800ms 产生一条新记录 ----------

var DEMO_DELAY_MIN = 3130, DEMO_DELAY_MAX = 3190; /* 与真实数据 delay 量级对齐 */

var DEMO_STATE_WEIGHTS = [
  /* 与真实数据各状态占比量级对齐：FL ≫ HANG ≫ SUCCESS ≫ UNEXPECTED ≫ Fake_Success */
  { st: "FL", w: 0.72 }, { st: "HANG", w: 0.173 }, { st: "SUCCESS", w: 0.0928 },
  { st: "UNEXPECTED", w: 0.0567 }, { st: "Fake_Success", w: 0.00012 }

/* 钟形基线 + 随机微扰：delay 3130–3190 共 61 桶，先按 Σbell 归一化再分配

  if (demoHist) return demoHist;

    var target = DEMO_HIST_TOTALS[st];

  var base = Math.floor(clean[0].delay_raw / HIST_BIN_RAW) * HIST_BIN_RAW;
  var bins = [], byLo = {};
  for (var j = 0; j < clean.length; j += 1) {
    var lo = base + Math.floor((clean[j].delay_raw - base) / HIST_BIN_RAW) * HIST_BIN_RAW;
    var bin = byLo[lo];
    if (!bin) { bin = { delay_raw: lo, hi: lo + HIST_BIN_RAW, count: 0 }; byLo[lo] = bin; bins.push(bin); }
    bin.count += clean[j].count;
  }
  bins.sort(function (a, b) { return a.delay_raw - b.delay_raw; });
  return bins;
}
/* 最近一帧直方图数据：真实 / demo 两条路径都在 loadHistogram 顶部写入，
 * 供 resize 防抖重算复用（不重新发请求、不重复累积 demo 计数）。 */
var lastHistData = null;
function renderHistogram(d) {
  var hist = (d && d.histogram) || {};
  var series = Array.isArray(hist.series) ? hist.series : [];
  var byState = {};
  series.forEach(function (s) { if (s && s.state) byState[s.state] = s; });
  [HIST_STACKED[0], HIST_STACKED[1], HIST_TALL].forEach(function (st) {
    var s = byState[st];
    var entries = [];
    if (s && Array.isArray(s.points)) {
      s.points.forEach(function (p) {
        if (p && typeof p.count === "number" && p.count > 0) {
          entries.push({ delay_raw: p.delay_raw, count: p.count });
        }
      });
      entries.sort(function (a, b) { return a.delay_raw - b.delay_raw; });
      entries = binDelayEntries(entries); /* 逐 raw 计数 → 5 宽区间桶 */
    }
    var handle = histHandles[st];
    if (entries.length === 0) {
      // 缺数据：显示「未知」，不画 0 柱冒充
      var note = handle.chart.parentNode.querySelector(".axis-note");
      if (note && !note.dataset.unknown) {
        note.dataset.unknown = "1";
        note.textContent = "该状态暂无 delay 分布数据（未知）";
      }
      updateStatChart(handle.cols, handle.chart, [], HIST_BARS, st);
      return;
    }
    updateStatChart(handle.cols, handle.chart, entries, HIST_BARS, st);
  });
}
async function loadHistogram() {
  /* demo 模式：用 demoHistData() 生成契约同形响应，渲染路径与真实模式完全一致 */
  var d = DEMO_MODE
    ? demoHistData()
    : await apiGet("/api/histogram" + datasetQueryLead());
  lastHistData = d;
  renderHistogram(d);
}
/* resize 防抖 120ms：图高变化后用最近一帧数据重跑三图柱高/标签（测量式重算）。
 * 监听在顶层注册一次，不随轮询累积（与 syncNumColumns 的 resize 监听同款惯例）。 */
var histResizeTimer = null;
window.addEventListener("resize", function () {
  if (histResizeTimer !== null) clearTimeout(histResizeTimer);
  histResizeTimer = setTimeout(function () {
    histResizeTimer = null;
    if (lastHistData) renderHistogram(lastHistData);
  }, 120);
});

/* ---------- AI 活动面板 ---------- */
async function loadActivity() {
  var d = await apiGet("/api/activity");
  var mini = el("ai-mini"), tools = el("ai-tools"), recent = el("ai-recent");
  clearChildren(mini); clearChildren(tools);
  var running = d && typeof d.n_running === "number" ? d.n_running : null;
  var cards = [
    { k: "总调用数", v: d && typeof d.n_calls === "number" ? d.n_calls : null, cls: "" },
    { k: "运行中", v: running, cls: running && running > 0 ? "run" : "" },
    { k: "最近失败", v: d && typeof d.n_failed === "number" ? d.n_failed : null, cls: "fail" }
  ];
  cards.forEach(function (c) {
    var m = document.createElement("div");
    m.className = "mini-card";
    var k = document.createElement("div"); k.className = "k"; k.textContent = c.k;
    var v = document.createElement("div"); v.className = "v " + c.cls;
    v.textContent = c.v === null ? "未知" : fmtInt(c.v);
    m.appendChild(k); m.appendChild(v); mini.appendChild(m);
  });
  var counts = (d && d.tool_counts) || [];
  var top = counts.slice(0, 5);
  var maxCount = top.length ? Math.max.apply(null, top.map(function (t) { return t.count; })) : 0;
  top.forEach(function (t) {
    var row = document.createElement("div"); row.className = "trow";
    var n = document.createElement("span"); n.className = "tn"; n.textContent = toDisplayText(t.tool);
    var b = document.createElement("span"); b.className = "tb";
    var i = document.createElement("i");
    i.style.width = (maxCount ? Math.max(t.count / maxCount * 100, 2) : 0) + "%";
    b.appendChild(i);
    var c = document.createElement("span"); c.className = "tc"; c.textContent = toCount(t.count, "—");
    row.appendChild(n); row.appendChild(b); row.appendChild(c); tools.appendChild(row);
  });
  if (!top.length) {
    var nn = document.createElement("div"); nn.className = "footer-note"; nn.textContent = "未知";
    tools.appendChild(nn);
  }
  clearChildren(recent);
  var recents = (d && d.recent) || [];
  recents.slice(0, 10).forEach(function (r) {
    var row = document.createElement("div");
    var status = toDisplayText(r.status).toLowerCase();
    row.className = "rc " + (status === "running" ? "running" : status === "fail" || status === "error" ? "fail" : "ok");
    var dot = document.createElement("span"); dot.className = "dot";
    var tool = document.createElement("span"); tool.className = "tool"; tool.textContent = toDisplayText(r.tool);
    var args = document.createElement("span"); args.className = "args";
    args.textContent = toDisplayText(r.args_preview) || "未知";
    args.title = args.textContent;
    var dur = document.createElement("span"); dur.className = "dur";
    dur.textContent = typeof r.duration_s === "number" ? r.duration_s.toFixed(2) + "s" : "未知";
    row.appendChild(dot); row.appendChild(tool); row.appendChild(args); row.appendChild(dur);
    recent.appendChild(row);
  });
  if (!recents.length) {
    var nr = document.createElement("div"); nr.className = "footer-note"; nr.textContent = "未知";
    recent.appendChild(nr);
  }
}

/* ---------- 契约区 ---------- */
async function loadContracts() {
  var d = await apiGet("/api/contracts");
  el("ct-version").textContent = toDisplayText(d && d.contract_version) || "未知";
  el("ct-schema").textContent = toDisplayText(d && d.schema_version_constant) || "未知";
  el("ct-semantics").textContent = toDisplayText(d && d.state_label_semantics) || "未知";
  var schemas = el("ct-schemas");
  clearChildren(schemas);
  var arr = (d && d.schemas) || [];
  if (!arr.length) {
    var unk = document.createElement("span"); unk.className = "footer-note"; unk.textContent = "未知";
    schemas.appendChild(unk);
  }
  arr.forEach(function (s) {
    var code = document.createElement("code"); code.textContent = toDisplayText(s);
    schemas.appendChild(code);
  });
  var warns = el("ct-warnings");
  clearChildren(warns);
  var warr = (d && d.warnings) || [];
  if (!warr.length) {
    var none = document.createElement("span"); none.className = "none"; none.textContent = "无告警";
    warns.appendChild(none);
  }
  warr.forEach(function (w) {
    var div = document.createElement("div"); div.className = "w"; div.textContent = toDisplayText(w);
    warns.appendChild(div);
  });
  var vers = el("ct-versions");
  clearChildren(vers);
  var varr = (d && d.recent_versions) || [];
  if (!varr.length) {
    var nv = document.createElement("span"); nv.className = "footer-note"; nv.textContent = "未知";
    vers.appendChild(nv);
  }
  varr.forEach(function (v) {
    var div = document.createElement("div"); div.className = "vr";
    div.textContent = toDisplayText(v && v.version) + (v && v.note ? " · " + toDisplayText(v.note) : "");
    vers.appendChild(div);
  });
}

/* ---------- 刷新编排 ---------- */
var spinning = false;
async function refreshAll() {
  if (spinning) return;
  spinning = true;
  refreshBtn.classList.add("spin");
  var jobs = [
    loadSummary(),
    loadRecords(true),
    DEMO_MODE ? demoHistData() && loadHistogram() : loadHistogram(),
    DEMO_MODE ? Promise.resolve() : loadActivity(),
    DEMO_MODE ? Promise.resolve() : loadContracts()
  ];
  try { await Promise.allSettled(jobs); } finally {
    spinning = false;
    refreshBtn.classList.remove("spin");
  }
}

buildCountsTable();
buildHistPanes();

/* 自描述：boot 完成后打印一次生效配置快照（文件值 + URL 覆盖后的终值），仅一次 */
var effectiveConfigLogged = false;
function logEffectiveConfig() {
  if (effectiveConfigLogged) return;
  effectiveConfigLogged = true;
  console.info("[FI] effective config", fiConfigSnapshot(window.FI_CONFIG));
}

var demoTimer = null;
if (DEMO_MODE) {
  /* ?demo=1：不启动后端轮询；左栏每 800ms 推一条演示记录，
     右栏分布图每 2 拍用演化后的 demo 直方图重渲染（同一数据源联动） */
  showDemoBanner();
  DEMO_ON = true;
  refreshAll().then(logEffectiveConfig);
  demoTimer = startDemoMode();
} else {
  refreshAll().then(logEffectiveConfig);
  setInterval(function () { loadRecords(true); }, REFRESH_RECORDS_MS);
  setInterval(loadActivity, REFRESH_ACTIVITY_MS);
  setInterval(loadHistogram, REFRESH_HIST_MS);
}

refreshBtn.addEventListener("click", refreshAll);

/* document.hidden 期间跳过轮询，避免空转堆积 */
document.addEventListener("visibilitychange", function () {
  if (!document.hidden) refreshAll();
});
</script>
